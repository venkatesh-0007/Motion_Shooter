<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="150" style="background: #070915; font-family: 'Orbitron', sans-serif; border-radius: 8px; border: 1px solid rgba(0, 242, 254, 0.15);">
  <style>
    /* Neon glows */
    .glow-cyan { filter: url(#glowC); }
    .glow-pink { filter: url(#glowP); }

    /* Phone tilt rotation */
    @keyframes tiltPhone {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-18deg); }
      40% { transform: rotate(0deg); }
      60% { transform: rotate(18deg); }
      75% { transform: rotate(18deg); }
      80%, 90% { transform: rotate(0deg); } /* Recenter snap */
    }
    .phone-group {
      transform-origin: 150px 75px;
      animation: tiltPhone 6s ease-in-out infinite;
    }

    /* Crosshair movements matching phone tilt */
    @keyframes moveCrosshair {
      0%, 100% { transform: translate(0px, 0px); }
      20% { transform: translate(-50px, -15px); }
      40% { transform: translate(0px, 0px); }
      60% { transform: translate(50px, 20px); }
      75% { transform: translate(50px, 20px); }
      80%, 90% { transform: translate(0px, 0px); } /* Recenter snap */
    }
    .grid-crosshair {
      transform-origin: 450px 75px;
      animation: moveCrosshair 6s ease-in-out infinite;
    }

    /* Recenter button glow highlight */
    @keyframes buttonPress {
      0%, 74% { fill: rgba(22, 28, 45, 0.6); stroke: rgba(0, 242, 254, 0.3); }
      75%, 79% { fill: rgba(0, 242, 254, 0.2); stroke: #00f2fe; }
      80%, 100% { fill: rgba(22, 28, 45, 0.6); stroke: rgba(0, 242, 254, 0.3); }
    }
    .recenter-rect {
      animation: buttonPress 6s ease-in-out infinite;
    }

    /* Calibration wave ring when snapped back */
    @keyframes calibrateRing {
      0%, 78% { r: 0; opacity: 0; }
      80% { r: 5px; opacity: 1; stroke: #ff007f; }
      85% { r: 35px; opacity: 0; stroke: #00f2fe; }
      100% { r: 0; opacity: 0; }
    }
    .cal-ring {
      animation: calibrateRing 6s ease-in-out infinite;
    }
  </style>

  <defs>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Left: Smartphone tilt graphics -->
  <!-- Center pivots around (150, 75) -->
  <g class="phone-group">
    <!-- Phone body -->
    <rect x="115" y="30" width="70" height="90" rx="10" fill="#0f1225" stroke="#7e8b9b" stroke-width="2" />
    <rect x="120" y="38" width="60" height="74" rx="4" fill="#070915" stroke="rgba(255, 255, 255, 0.05)" />
    <!-- Phone speaker/camera -->
    <line x1="140" y1="34" x2="160" y2="34" stroke="#7e8b9b" stroke-width="1.5" />
    <!-- Phone controller layout crosshair mock -->
    <circle cx="150" cy="70" r="14" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-dasharray="4 2" />
    <!-- Dynamic tilt vector arrow -->
    <path d="M 135,70 A 15,15 0 0,1 165,70" fill="none" stroke="#00f2fe" stroke-width="2" marker-end="url(#arrow)" class="glow-cyan" />
    
    <!-- Recenter button mockup on phone -->
    <rect x="130" y="93" width="40" height="14" rx="3" class="recenter-rect" stroke-width="1" />
    <text x="150" y="102" fill="#ffffff" font-size="6" text-anchor="middle" font-weight="700">RECENTER</text>
  </g>

  <!-- Split line separator -->
  <line x1="300" y1="20" x2="300" y2="130" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4 4" />

  <!-- Right: Screen tracking grid -->
  <!-- Grid boundary at x=340 to x=560 -->
  <g transform="translate(0, 0)">
    <!-- Virtual viewport grid -->
    <rect x="340" y="25" width="220" height="100" rx="6" fill="#070915" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" />
    <g opacity="0.15">
      <line x1="340" y1="75" x2="560" y2="75" stroke="#00f2fe" />
      <line x1="450" y1="25" x2="450" y2="125" stroke="#00f2fe" />
      <circle cx="450" cy="75" r="30" fill="none" stroke="#00f2fe" />
      <circle cx="450" cy="75" r="60" fill="none" stroke="#00f2fe" />
    </g>

    <!-- Calibration wave ring -->
    <circle cx="450" cy="75" r="0" fill="none" stroke-width="2" class="cal-ring" />

    <!-- Aiming Crosshair -->
    <g class="grid-crosshair">
      <circle cx="450" cy="75" r="12" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 2" class="glow-cyan" />
      <circle cx="450" cy="75" r="5" fill="none" stroke="#ff007f" stroke-width="1.5" class="glow-pink" />
      <circle cx="450" cy="75" r="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- HUD Labels -->
  <text x="150" y="140" fill="#7e8b9b" font-size="8" text-anchor="middle">PHONE GYRO SENSOR</text>
  <text x="450" y="140" fill="#7e8b9b" font-size="8" text-anchor="middle">SCREEN CALIBRATION</text>
</svg>
